<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>PoTraffic</title>
    <base href="/" />
    <script>
        // Density resolver. Runs in <head>, before first paint, so the
        // page never flashes the wrong density. The colour theme is NOT set here: it
        // follows the device (prefers-color-scheme) through po-tokens.css alone.
        // Density changes made later, from Settings, are owned by js/po-appearance.js.
        (function () {
            var root = document.documentElement;
            var density = null;
            try { density = localStorage.getItem('potraffic:density'); } catch (e) { /* private mode */ }
            // Absent attribute means the default density, so only a real choice is stamped.
            if (density) root.setAttribute('data-density', density);
        })();
    </script>
    <!-- Radzen FIRST (AGENTS.md, Components): css/vendor.css loads Radzen's theme once (plus Leaflet)
         into the `vendor` cascade layer, before any app CSS. Everything below is unlayered and
         therefore outranks it whatever the specificity, so the app keeps its own look.
         No <RadzenTheme> component: it would inject a second copy. -->
    <link rel="stylesheet" href="css/vendor.css" />
    <!-- Po web standard tokens next: Inter + Space Grotesk (self-hosted), the indigo
         accent, the device-following light/dark palette and the shell classes. -->
    <link rel="stylesheet" href="css/po-tokens.css" />
    <!-- Material Symbols is the app's icon font (the only Google Fonts load left). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- PoTraffic's own tokens (--pt-*), every colour/font/radius aliased to --po-*. -->
    <link rel="stylesheet" href="css/pt-tokens.css" />
    <link rel="stylesheet" href="css/po-motion.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="PoTraffic.Client.bundle.scp.css" rel="stylesheet" />
    <!-- After the scoped bundle, so the .pt-glass utilities win a specificity tie with a
         component's own surface. The text-bearing glass, with its solid fallbacks. -->
    <link rel="stylesheet" href="css/po-glass.css" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PoTraffic" />
    <!-- Service worker + install prompt. Loaded here, not imported from .NET:
         beforeinstallprompt fires long before Blazor WASM has finished booting, and
         it is the only chance to capture it. See js/pt-pwa.js. -->
    <script src="js/pt-pwa.js"></script>

    <!-- View Transitions for SPA navigation. A classic script and not a module,
         because it installs a capture-phase click listener that has to be in place
         before Blazor's own link interception runs. -->
    <script src="js/pt-viewtransition.js"></script>

    <!-- Tab with nothing focused opens the developer window (/po-dev.html). -->
    <script src="js/po-devwindow.js"></script>

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" aria-hidden="true">×</span>
    </div>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="js/blazor-error-reporter.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
