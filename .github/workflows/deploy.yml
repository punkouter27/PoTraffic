name: Build & Deploy

on:
  push:
    branches: [master]
  # Pull requests (Dependabot's too) get the build and tests; only a push to master deploys.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for azure/login OIDC (federated, no stored client secret)

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  AZURE_RESOURCE_GROUP: PoTraffic
  API_PROJECT_PATH: src/PoTraffic.API/PoTraffic.API.csproj
  PRODUCTION_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and publish only — no test tier runs here. Every tier (unit, integration, E2E)
  # runs locally via `pwsh ./SCRIPTS/run-tests.ps1`, whose four-tier HTML report is the
  # gate; the integration and E2E tiers need Docker and a live Testing host anyway.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore ${{ env.API_PROJECT_PATH }}
      - run: dotnet build ${{ env.API_PROJECT_PATH }} --no-restore -c Release
      - run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release --no-build -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    # Deploy only from master (workflow_dispatch can target other branches).
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    steps:
      # Only SCRIPTS/ — the deploy job needs the smoke script and nothing else, and a full
      # checkout here would pull the whole repo to run one file.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: SCRIPTS
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Same step in every Po web repo. F1 gives the app about 60 CPU-minutes a day; once spent, Azure stops the
      # site (usageState Exceeded) until 00:00 UTC and refuses the package with a bare 403. Say what it is.
      - name: Check the F1 daily CPU quota
        run: |
          usage=$(az webapp show -g "${{ github.event.repository.name }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" --query usageState -o tsv)
          if [ "$usage" = "Exceeded" ]; then
            echo "::error::${{ vars.AZURE_WEBAPP_NAME }} has used up its F1 daily CPU quota, so Azure refuses the package until 00:00 UTC. Rerun after that."
            exit 1
          fi

      # Same pair in every Po web repo: keep the live build, and put it back if anything fails once the
      # new package is live (see "Roll back to the previous build" at the end of this job).
      - name: Back up the live site
        id: backup
        run: |
          token=$(az account get-access-token --query accessToken -o tsv)
          if curl -fsS --max-time 300 -H "Authorization: Bearer $token" -o previous.zip \
               "https://${{ vars.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/zip/site/wwwroot/" && [ -s previous.zip ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Backed up $(du -h previous.zip | cut -f1) of the live site."
          else
            echo "::warning title=No backup::Could not download the live site, so this deploy cannot be rolled back."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/webapps-deploy@v3
        id: deploy
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: publish

      # The deploy step reports success once App Service accepts the package, which says
      # nothing about whether the app then starts. This is the check that it did: health,
      # hydration, and the Blazor shell and boot assets actually serving. It exits non-zero
      # on any Fail, so a green deploy that boots into 500.30 turns the run red.
      # Same gate in every Po web repo: the new build is the one answering (X-Commit on /health/live is this
      # commit, not the old instance still serving), then its dependencies answer (/health).
      - name: Health gate (this commit on /health/live, then /health)
        shell: bash
        run: |
          base="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for attempt in $(seq 1 60); do
            commit=$(curl -s -D - -o /dev/null --max-time 30 "$base/health/live" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-commit" {print $2}' || true)
            [ "$commit" = "$GITHUB_SHA" ] && { echo "/health/live serves $GITHUB_SHA (attempt $attempt)"; break; }
            [ "$attempt" = "60" ] && { echo "::error::/health/live still serves ${commit:-no X-Commit header}, not $GITHUB_SHA"; exit 1; }
            sleep 15
          done
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/health" || echo 000)
            [ "$code" = "200" ] && { echo "/health -> 200 (attempt $attempt)"; exit 0; }
            sleep 15
          done
          echo "::error::/health never returned 200 (last: $code)"; exit 1

      - name: Post-deploy smoke
        shell: pwsh
        run: ./SCRIPTS/post-deploy-smoke.ps1 -BaseUrl "${{ env.PRODUCTION_URL }}"

      - name: Roll back to the previous build
        if: failure() && steps.deploy.outcome == 'success' && steps.backup.outputs.ok == 'true'
        run: |
          az webapp deploy -g "${{ github.event.repository.name }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path previous.zip --type zip --clean true
          echo "::error title=Rolled back::${{ github.sha }} failed after it went live; the previous build is live again."
